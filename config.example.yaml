# TickView konfigurace – zkopírujte tento soubor na config.yaml a doplňte hodnoty.
# Obsah config.yaml se necommituje (může obsahovat API klíče).

# Alpaca (volitelný zdroj živých amerických akcií) – klíče z Paper Trading dashboardu;
# bez vyplněných klíčů se zdroj nezapne (celou sekci lze smazat)
alpaca:
  endpoint: https://paper-api.alpaca.markets/v2
  api_key: ""   # např. PK...
  secret: ""

# cTrader Open API (volitelný zdroj forexu, kovů a CFD s tick volume; dodá i objem
# pro IBKR forex, kovy a CFD) – aplikace z openapi.ctrader.com (Client ID a secret),
# tokeny ze Sandbox po schválení aplikace (scope accounts); stačí demo účet u cTrader brokera
ctrader:
  client_id: ""
  client_secret: ""
  access_token: ""     # obnovuje se sám (nový token se zapíše sem)
  refresh_token: ""
  account_id: ""       # ctidTraderAccountId; prázdné = první demo / živý účet tokenu
  live: false          # false = demo server, true = živý
  # Ruční přiřazení symbolů IBKR k názvům u brokera (jinak se dohledají samy)
  symbols: {}          # např. {IBUST100: NAS100, IBDE40: GER40}

# Interactive Brokers – TWS nebo IB Gateway musí běžet a mít povolené API
ibkr:
  host: 127.0.0.1
  port: 7497
  client_id: 30

# Telegram – notifikace alertů; token bota od @BotFather, chat id zjistí
# aplikace (Settings → Zjistit chat ID) po první zprávě botovi
telegram:
  bot_token: ""
  chat_id: ""

# Replay – krok zpět v čase: delete (povolit, obchody po bodu návratu se
# smažou), confirm (povolit po potvrzení), off (zakázat)
replay:
  rewind: "delete"

# COT report CFTC – data jsou zdarma bez klíče; volitelný app token
# (publicreporting.cftc.gov → Sign up → Developer Settings) zvedá limit dotazů
cot:
  app_token: ""
